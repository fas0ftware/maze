{% extends "base.html" %}
{% block content %}
  <h1>Secure Portal &mdash; Stage {{ layer }} of 3</h1>
  <form method="post" action="/login" autocomplete="off">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" maxlength="256" autofocus>
    <button type="submit">Sign in</button>
  </form>
  <p class="meta"><a href="/exit">Exit session</a></p>
{% endblock %}
